<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Corridor</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1311">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#e8efe6;font-family:system-ui,Segoe UI,Roboto,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:20}
#sub{position:fixed;left:0;right:0;bottom:22%;text-align:center;font-size:clamp(18px,4vmin,34px);letter-spacing:.05em;font-style:italic;color:#ddd;opacity:0;transition:opacity 1s;z-index:30;pointer-events:none;text-shadow:0 0 12px #000}
#menu,#panel,#end{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vmin;z-index:40;background:radial-gradient(ellipse at center,rgba(0,0,0,.25),rgba(0,0,0,.8))}
#panel,#end{background:rgba(0,0,0,.88);text-align:center;padding:6vmin}
h1{margin:0 0 3vmin;font-size:clamp(34px,10vmin,90px);letter-spacing:.18em;font-weight:800;text-shadow:0 0 30px rgba(140,200,150,.45)}
h2{margin:0;font-size:clamp(24px,6vmin,48px);letter-spacing:.1em}
p{margin:0;font-size:clamp(16px,3.6vmin,28px);line-height:1.5;color:#b9c7b6}
.btn{width:min(70vw,360px);padding:2.2vmin 0;font-size:clamp(18px,4.2vmin,30px);font-weight:700;letter-spacing:.2em;color:#e8efe6;background:rgba(30,45,36,.75);border:2px solid #7fa585;border-radius:10px;cursor:pointer}
.btn:active{background:#7fa585;color:#000}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none}
#hud button{pointer-events:auto;touch-action:none;color:#fff;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);border-radius:16px;font-size:6vmin;backdrop-filter:blur(3px)}
#hud button.on{background:rgba(255,255,255,.4)}
#dpad{position:absolute;left:calc(3vmin + env(safe-area-inset-left));bottom:calc(3vmin + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,15vmin);grid-template-rows:repeat(2,15vmin);gap:1.5vmin}
#up{grid-column:2;grid-row:1}#lf{grid-column:1;grid-row:2}#dn{grid-column:2;grid-row:2}#rt{grid-column:3;grid-row:2}
#ibtn{position:absolute;right:calc(5vmin + env(safe-area-inset-right));bottom:calc(8vmin + env(safe-area-inset-bottom));width:19vmin;height:19vmin;border-radius:50%!important;font-size:9vmin!important;font-weight:800}
#ibtn.glow{background:rgba(255,70,70,.55);border-color:#ff8a8a;box-shadow:0 0 22px #f33}
#prompt{position:absolute;left:0;right:0;top:62%;text-align:center;font-size:clamp(16px,3.6vmin,28px);color:#fff;text-shadow:0 0 8px #000;opacity:0;transition:opacity .25s}
#rot{display:none;position:fixed;inset:0;z-index:100;background:#000;align-items:center;justify-content:center;text-align:center;padding:10vw;font-size:6vw}

</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fade"></div>
<div id="sub"></div>

<div id="hud" class="hidden">
  <div id="dpad">
    <button id="up">▲</button><button id="lf">◀</button><button id="dn">▼</button><button id="rt">▶</button>
  </div>
  <div id="prompt"></div>
  <button id="ibtn">I</button>
</div>

<div id="menu">
  <h1>THE CORRIDOR</h1>
  <button class="btn" id="bPlay">PLAY</button>
  <button class="btn" id="bSet">SETTINGS</button>
  <button class="btn" id="bDet">GAME DETAILS</button>
</div>

<div id="panel" class="hidden">
  <h2 id="pT"></h2><p id="pB"></p>
  <button class="btn" id="bBack">BACK</button>
</div>

<div id="end" class="hidden">
  <h2>THE END</h2>
  <button class="btn" id="bMenu">MENU</button>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
</body>
</html>
